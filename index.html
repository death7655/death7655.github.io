<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checksum Validator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js" defer></script>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <header>
                <h1>Checksum Validator</h1>
                <p class="subtitle">Secure validation for financial and retail standards.</p>
            </header>

            <div id="visual-preview" class="preview-box luhn-mode">
                <div class="card-content">
                    <span id="preview-label">CREDIT CARD</span>
                    <div id="preview-number">#### #### #### ####</div>
                    <div class="card-footer">
                        <span id="preview-subtext">VALIDATOR</span>
                    </div>
                </div>
            </div>

            <div class="form-container">
                <div class="input-group">
                    <label for="algoType">Algorithm Standard</label>
                    <select id="algoType" onchange="updateUI()">
                        <option value="luhn">Credit Card (Luhn)</option>
                        <option value="isbn10">ISBN-10 (Books)</option>
                        <option value="upc">Barcode (UPC)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="numberInput">Identification Number</label>
                    <input type="text" id="numberInput" placeholder="Enter digits..." oninput="syncPreview()">
                </div>

                <button class="btn-primary" onclick="checkNumber()">Validate Number</button>
            </div>
            
            <div id="result-display">
                <p id="result-text">Enter a number to begin</p>
            </div>
        </div>
    </div>
</body>
</html>
